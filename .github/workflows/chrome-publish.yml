name: Build and Publish Extension

on:
  push:
    branches:
      - main
      - master
    # 限制条件：只有源码文件夹和关键配置文件被改动时才触发工作流，修改文档(docs)将保持静默
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'sidebar.html'
  workflow_dispatch: # 支持手动运行工作流，方便测试

# 授予写入权限以允许工作流推送 Git Tag 和发布 Release 制品
permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, Tag & Publish to Chrome Web Store
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码 (fetch-depth: 0 完整拉取历史，用以生成准确的 Release 提交变动历史)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设置 Node.js 环境并缓存依赖
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 3. 读取 package.json 中的版本号
      - name: Extract Project Version
        id: get_version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 4. 安装依赖
      - name: Install Dependencies
        run: npm install

      # 5. 构建项目
      - name: Build Extension
        run: npm run build

      # 6. 将编译产物 dist 压缩为 zip
      - name: Package Extension
        run: |
          cd dist
          zip -r ../extension.zip ./*
          cd ..

      # 7. 自动打 Git Tag 并推送 (如果该版本的 Tag 在仓库中还不存在)
      - name: Create Git Tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Skipping git tagging."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      # 8. 自动创建 GitHub Release，挂载 zip 包，并根据提交记录自动生成 Changelog 变动说明
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          files: extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. 上传并发布至 Chrome Web Store
      - name: Upload & Publish to Chrome Web Store
        uses: fregante/chrome-extension-upload@v2
        with:
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          extension-id: ${{ secrets.CHROME_APP_ID }}
          file-path: ./extension.zip
          publish: true
